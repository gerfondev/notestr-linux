[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nostr-private-notes"
dynamic = ["version"]
description = "Notes privées Nostr pour Linux, compatibles avec les documents personnels Pages"
requires-python = ">=3.10"
dependencies = ["monstr==0.1.9", "websockets>=17.1,<18", "keyring>=25.7,<26", "markdown-it-py>=4.2,<5", "argon2-cffi>=25.1,<26", "weasyprint>=70,<71", "cryptography>=50.0.1", "Pillow>=12.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nostr-notes = "nostr_notes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
nostr_notes = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "nostr_notes.__version__"}
